[package]
name = "web_3d"
version = "0.1.0"
edition = "2021"
description = "WEB_3D : serveur de la visionneuse 3D et de ses projets"

[dependencies]
# Serveur HTTP/HTTPS, appairage et canal de pilotage : communs aux web tools (dépôt web_suite)
web_tools_commun = { git = "https://github.com/pilou33620/web_suite", rev = "6d482b97c5368434bc5db60ed6ff9878a97348fa" }
serde_json = { version = "1", features = ["preserve_order"] } # les clés JSON gardent leur ordre, comme en Python
regex = "1"
serde = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
strip = true
