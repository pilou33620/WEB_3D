name: bancs d'essai

on:
  push:
  pull_request:

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exemples — OpenCascade, lecteurs three.js, repère propre d'une pièce
        run: node test/banc-exemples.mjs

      - name: Serveur — fichiers servis, Host
        run: python test/banc-serveur.py
