name: bancs d'essai

on:
  push:
  pull_request:

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exemples — OpenCascade, lecteurs three.js, repère propre d'une pièce
        run: node test/banc-exemples.mjs

      - name: Canal de pilotage (MCP de web_suite) — commandes de la page 3D
        run: node test/banc-pilote-3d.mjs

      - name: Serveur — fichiers servis, Host
        run: python test/banc-serveur.py

      - name: Appairage — code, jeton et cookie partagés
        run: python appairage.py

      - name: Canal de pilotage — serveur (pilote.py)
        run: python pilote.py

      - name: appairage.py et pilote.py sont les mêmes que ceux de web_suite
        run: |
          git clone --quiet --depth 1 https://github.com/pilou33620/web_suite.git ../web_suite
          diff <(tr -d '\r' < ../web_suite/lanceur/appairage.py) <(tr -d '\r' < appairage.py)
          diff <(tr -d '\r' < ../web_suite/lanceur/pilote.py) <(tr -d '\r' < pilote.py)

      - name: Conception — expressions, solveur d'esquisse, opérations OpenCascade
        run: node test/banc-conception.mjs

      - name: Conception — commandes ajoutées, esquisse, exports
        run: node test/banc-conception-plus.mjs

      - name: Conception — pièces de référence, avant et après un changement de paramètres
        run: node test/banc-pieces-reference.mjs

      - name: Conception — la page dans un Chrome sans écran
        run: node --experimental-websocket test/banc-conception-page.mjs
        env:
          CHROMIUM: google-chrome

      - name: Conception — commandes ajoutées, dans la page
        run: node --experimental-websocket test/banc-conception-plus-page.mjs
        env:
          CHROMIUM: google-chrome

      - name: Conception — désignation, mesure, boîtes de question
        run: node --experimental-websocket test/banc-conception-retours.mjs
        env:
          CHROMIUM: google-chrome
